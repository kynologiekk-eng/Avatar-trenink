<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Šatna pejska</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#20302a;background:#f4f7f5}*{box-sizing:border-box}body{margin:0;padding:20px}.app{max-width:760px;margin:auto;background:white;border-radius:22px;padding:18px;box-shadow:0 10px 35px #173b2c1f}h1{margin:0 0 6px;font-size:1.5rem}.sub{margin:0 0 16px;color:#596660}.preview{position:relative;width:min(100%,543px);aspect-ratio:1086/1448;margin:auto;background:#fff;border-radius:18px;overflow:hidden;border:1px solid #dce5e0}.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.controls{display:grid;gap:10px;margin-top:18px}.choices{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;border:1px solid #b9c9c1;border-radius:12px;padding:11px 15px;background:#fff;cursor:pointer}button[aria-pressed="true"]{background:#175f43;color:#fff;border-color:#175f43}.download{background:#b88921;color:white;border-color:#b88921;font-weight:700}.status{min-height:1.4em;color:#596660;font-size:.93rem}@media(max-width:480px){body{padding:10px}.app{padding:14px;border-radius:16px}}
</style>
</head>
<body>
<main class="app">
<h1>Šatna pejska</h1>
<p class="sub">Vyber vodítko a stáhni hotového avatara.</p>
<div class="preview" aria-label="Náhled avatara">
<img id="base" src="assets/pes.jpg" alt="Základní avatar pejska">
<img id="overlay" src="assets/voditko_ruzove.png" alt="Růžové vodítko" hidden>
</div>
<div class="controls">
<strong>Vodítko</strong>
<div class="choices" role="group" aria-label="Výběr vodítka">
<button type="button" class="choice" data-value="zelene" aria-pressed="true">Zelené</button>
<button type="button" class="choice" data-value="ruzove" aria-pressed="false">Růžové</button>
</div>
<button type="button" id="download" class="download">Stáhnout avatara jako PNG</button>
<div id="status" class="status" aria-live="polite"></div>
</div>
</main>
<script>
const overlay=document.getElementById('overlay');
const buttons=[...document.querySelectorAll('.choice')];
const status=document.getElementById('status');
let selected='zelene';
buttons.forEach(btn=>btn.addEventListener('click',()=>{
 selected=btn.dataset.value;
 overlay.hidden=selected!=='ruzove';
 buttons.forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
 status.textContent=selected==='ruzove'?'Nasazené růžové vodítko.':'Nasazené zelené vodítko.';
}));
document.getElementById('download').addEventListener('click',async()=>{
 const base=document.getElementById('base');
 if(!base.complete || (selected==='ruzove'&&!overlay.complete)){status.textContent='Obrázky se ještě načítají.';return;}
 const canvas=document.createElement('canvas'); canvas.width=1086; canvas.height=1448;
 const ctx=canvas.getContext('2d'); ctx.drawImage(base,0,0,1086,1448);
 if(selected==='ruzove') ctx.drawImage(overlay,0,0,1086,1448);
 canvas.toBlob(blob=>{
  if(!blob){status.textContent='Stažení se nepodařilo.';return;}
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='avatar_'+selected+'.png'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); status.textContent='Avatar je připravený ke stažení.';
 },'image/png');
});
</script>
</body>
</html>
